// --- Polyfill: sostituisce window.storage (disponibile solo negli artifact Claude)
// con localStorage, cosi' l'app funziona identica una volta ospitata altrove (es. GitHub Pages) ---
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v, shared: false };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  list: async (prefix) => {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, shared: false };
  },
};

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function getMealsForDate(date) {
  const dayName = GIORNI[date.getDay()];
  const weekIdx = getISOWeek(date) % PIANO_SETTIMANE.length;
  return PIANO_SETTIMANE[weekIdx][dayName];
}

// --- Fabbisogno calorico dinamico ---
const ANNO_NASCITA = 2003; // 23 anni a settembre 2026
const PESO_INIZIALE = 100; // usato finché non registri una misurazione
const CALORIE_BASE_PIANO = 1850; // kcal su cui sono tarate le quantità scritte nel piano pasti

function etaAttuale(date) {
  return date.getFullYear() - ANNO_NASCITA;
}

function pesoAttualeDa(physLogs) {
  return physLogs.length ? physLogs[0].peso : PESO_INIZIALE;
}

function fattoreAttivitaDa(actLogs, date = new Date()) {
  const finestra = 28 * 86400000; // ultime 4 settimane
  const recenti = actLogs.filter((l) => date - new Date(l.date) <= finestra && date - new Date(l.date) >= 0);
  const minutiTotali = recenti.reduce((s, l) => s + l.durata, 0);
  const minutiSettimanaMedi = minutiTotali / 4;
  const bonus = Math.min(0.3, minutiSettimanaMedi / 1000); // vita sedentaria + bonus in base a quanto ti alleni
  return 1.2 + bonus;
}

const PESO_OBIETTIVO_DEFAULT = 80;
const DATA_OBIETTIVO_DEFAULT = "2027-04-30";
const TIPI_OBIETTIVO = [
  { key: "perdita", label: "Perdita peso" },
  { key: "mantenimento", label: "Mantenimento" },
  { key: "aumento", label: "Aumento massa" },
];

function calcolaFabbisogno(physLogs, actLogs, obiettivo, date = new Date()) {
  const peso = pesoAttualeDa(physLogs);
  const eta = etaAttuale(date);
  const bmr = 10 * peso + 6.25 * ALTEZZA_CM - 5 * eta + 5; // Mifflin-St Jeor, uomo
  const fattore = fattoreAttivitaDa(actLogs, date);
  const tdee = bmr * fattore;

  const tipo = obiettivo?.tipo || "perdita";
  const pesoTarget = obiettivo?.pesoTarget ?? PESO_OBIETTIVO_DEFAULT;
  const dataTarget = obiettivo?.dataTarget ? new Date(obiettivo.dataTarget) : new Date(DATA_OBIETTIVO_DEFAULT);
  const settimaneRimanenti = Math.max(1, (dataTarget - date) / (7 * 86400000));

  let target = tdee;
  let proteinePerKg = 1.8;
  let grassiPerc = 0.27;

  if (tipo === "perdita") {
    const kgDaPerdere = Math.max(0, peso - pesoTarget);
    let deficit = kgDaPerdere > 0 ? (kgDaPerdere * 7700) / (settimaneRimanenti * 7) : 0;
    deficit = Math.min(deficit, 1000); // tetto di sicurezza sul deficit giornaliero
    target = tdee - deficit;
  } else if (tipo === "aumento") {
    const kgDaAumentare = Math.max(0, pesoTarget - peso);
    let surplus = kgDaAumentare > 0 ? (kgDaAumentare * 7700) / (settimaneRimanenti * 7) : 250;
    surplus = Math.min(surplus, 500); // tetto per limitare l'accumulo di grasso
    target = tdee + surplus;
    proteinePerKg = 2.0; // più proteine per sostenere la crescita muscolare
    grassiPerc = 0.25;
  } else {
    target = tdee; // mantenimento: nessun deficit o surplus
  }

  const sogliaMinima = 1500; // soglia di sicurezza per un uomo adulto
  if (target < sogliaMinima) target = sogliaMinima;
  target = Math.round(target / 10) * 10;

  const proteine = Math.round(peso * proteinePerKg);
  const grassi = Math.round((target * grassiPerc) / 9);
  const carboidrati = Math.max(0, Math.round((target - proteine * 4 - grassi * 9) / 4));

  return { peso, eta, bmr: Math.round(bmr), tdee: Math.round(tdee), target, proteine, grassi, carboidrati, fattoreAttivita: Math.round(fattore * 100) / 100, tipo };
}

function scalaQuantita(testo, fattore) {
  return testo.replace(/(\d+(?:\.\d+)?)(g|ml)\b/g, (m, num, unit) => {
    let val = Math.round((parseFloat(num) * fattore) / 5) * 5;
    if (val < 5) val = 5;
    return `${val}${unit}`;
  });
}

function suggerisciPesoTarget(tipo, pesoAttuale) {
  if (tipo === "perdita") return Math.max(50, Math.round(pesoAttuale - 15));
  if (tipo === "aumento") return Math.round(pesoAttuale + 5);
  return pesoAttuale;
}

function todayKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function useStoredState(key, initial) {
  const [value, setValue] = useState(initial);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const res = await window.storage.get(key, false);
        if (mounted && res && res.value) setValue(JSON.parse(res.value));
      } catch (e) {
        // key not present yet, keep initial
      } finally {
        if (mounted) setLoaded(true);
      }
    })();
    return () => { mounted = false; };
  }, [key]);

  const save = useCallback(async (next) => {
    setValue(next);
    try {
      await window.storage.set(key, JSON.stringify(next), false);
    } catch (e) {
      console.error("Errore salvataggio", key, e);
    }
  }, [key]);

  return [value, save, loaded];
}

const CAMPI_MISURE = [
  { key: "vita", label: "Girovita", unit: "cm" },
  { key: "fianchi", label: "Fianchi", unit: "cm" },
  { key: "torace", label: "Torace", unit: "cm" },
  { key: "collo", label: "Collo", unit: "cm" },
  { key: "braccio", label: "Braccio", unit: "cm" },
  { key: "coscia", label: "Coscia", unit: "cm" },
];

const ALTEZZA_CM = 187;

function calcBMI(peso, altezzaCm) {
  const h = altezzaCm / 100;
  if (!peso || !h) return null;
  return Math.round((peso / (h * h)) * 10) / 10;
}

function categoriaBMI(bmi) {
  if (bmi == null) return "";
  if (bmi < 18.5) return "sottopeso";
  if (bmi < 25) return "normopeso";
  if (bmi < 30) return "sovrappeso";
  return "obesità";
}

function MiniChart({ title, unit, data }) {
  if (data.length < 2) return null;
  const values = data.map((d) => d.valore);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const w = 260, h = 90, pad = 8;
  const coords = values.map((v, i) => ({
    x: pad + (i * (w - 2 * pad)) / (values.length - 1),
    y: h - pad - ((v - min) / range) * (h - 2 * pad),
  }));
  const points = coords.map((c) => `${c.x},${c.y}`).join(" ");
  return (
    <div style={{ background: "var(--surface)", borderRadius: 14, padding: "12px 8px 8px" }}>
      <p style={{ margin: "0 8px 6px", fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)" }}>
        {title}{unit ? ` (${unit})` : ""}
      </p>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 100, display: "block" }} preserveAspectRatio="none">
        <polyline points={points} style={{ fill: "none", stroke: "var(--accent)", strokeWidth: 2 }} />
        {coords.map((c, i) => (
          <circle key={i} cx={c.x} cy={c.y} r="2.5" style={{ fill: "var(--accent)" }} />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", padding: "0 6px", fontFamily: "var(--font-body)", fontSize: 10, color: "var(--text-dim)" }}>
        <span>{data[0].data}</span>
        <span>{data[data.length - 1].data}</span>
      </div>
    </div>
  );
}

function ParametriFisici({ logs, saveLogs, obiettivo, saveObiettivo, actLogs }) {
  const [showForm, setShowForm] = useState(false);

  const [misure, setMisure] = useState({});
  const [note, setNote] = useState("");
  const [photo, setPhoto] = useState(null);
  const fileRef = useRef(null);

  const handlePhoto = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(file);
  };

  const addLog = () => {
    if (!peso) return;
    const misureFinali = {};
    CAMPI_MISURE.forEach((c) => { if (misure[c.key]) misureFinali[c.key] = parseFloat(misure[c.key]); });
    const pesoNum = parseFloat(peso);
    const entry = {
      id: Date.now(), date: todayKey(), peso: pesoNum,
      bmi: calcBMI(pesoNum, ALTEZZA_CM), misure: misureFinali, note, photo,
    };
    const next = [entry, ...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
    saveLogs(next);
    setPeso(""); setMisure({}); setNote(""); setPhoto(null);
    setShowForm(false);
  };

  const removeLog = (id) => saveLogs(logs.filter((l) => l.id !== id));

  const cronologici = [...logs].reverse();
  const dataLabel = (l) => new Date(l.date).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });

  const grafici = [
    { key: "peso", title: "Peso", unit: "kg", data: cronologici.filter((l) => l.peso != null).map((l) => ({ data: dataLabel(l), valore: l.peso })) },
    { key: "bmi", title: "BMI", unit: "", data: cronologici.filter((l) => l.bmi != null).map((l) => ({ data: dataLabel(l), valore: l.bmi })) },
    ...CAMPI_MISURE.map((c) => ({
      key: c.key, title: c.label, unit: c.unit,
      data: cronologici.filter((l) => l.misure && l.misure[c.key] != null).map((l) => ({ data: dataLabel(l), valore: l.misure[c.key] })),
    })),
  ];

  const ultimoBMI = logs[0]?.bmi;
  const fabbisogno = calcolaFabbisogno(logs, actLogs, obiettivo);

  const primoLog = logs.length ? logs[logs.length - 1] : null;
  const ultimoLog = logs.length ? logs[0] : null;
  let reportStats = null;
  if (primoLog && ultimoLog && primoLog.id !== ultimoLog.id) {
    const giorniTotali = Math.max(1, (new Date(ultimoLog.date) - new Date(primoLog.date)) / 86400000);
    const settimaneTotali = giorniTotali / 7;
    const variazionePeso = Math.round((ultimoLog.peso - primoLog.peso) * 10) / 10;
    const mediaSettimanale = Math.round((variazionePeso / settimaneTotali) * 100) / 100;
    const variazioneBMI = ultimoLog.bmi != null && primoLog.bmi != null ? Math.round((ultimoLog.bmi - primoLog.bmi) * 10) / 10 : null;

    let progresso = null;
    if (obiettivo.tipo !== "mantenimento" && obiettivo.pesoTarget) {
      const distanzaIniziale = Math.abs(primoLog.peso - obiettivo.pesoTarget);
      const distanzaAttuale = Math.abs(ultimoLog.peso - obiettivo.pesoTarget);
      const percentuale = distanzaIniziale > 0 ? Math.min(100, Math.max(0, Math.round((1 - distanzaAttuale / distanzaIniziale) * 100))) : 100;
      const giorniAllaScadenza = Math.round((new Date(obiettivo.dataTarget) - new Date()) / 86400000);
      let stimaData = null;
      if (mediaSettimanale !== 0 && distanzaAttuale > 0) {
        const versoObiettivo = obiettivo.tipo === "perdita" ? mediaSettimanale < 0 : mediaSettimanale > 0;
        if (versoObiettivo) {

          stimaData = new Date(Date.now() + settimaneStimate * 7 * 86400000);
        }
      }
      progresso = { percentuale, distanzaAttuale: Math.round(distanzaAttuale * 10) / 10, giorniAllaScadenza, stimaData };
    }

    reportStats = { giorniTotali: Math.round(giorniTotali), variazionePeso, mediaSettimanale, variazioneBMI, progresso };
  }

  const logsConFoto = [...logs].reverse().filter((l) => l.photo); // dal più vecchio al più recente
  const fotoIdx = logsConFoto.length ? Math.min(fotoIndex ?? logsConFoto.length - 1, logsConFoto.length - 1) : 0;
  const fotoCorrente = logsConFoto[fotoIdx];

  return (
    <div style={{ padding: "20px 18px 90px" }}>

                    <p style={{ margin: "2px 0 0", fontFamily: "var(--font-head)", fontSize: 18, color: "var(--text)" }}>{reportStats.mediaSettimanale > 0 ? "+" : ""}{reportStats.mediaSettimanale} kg</p>
                  </div>
                  <div style={{ background: "var(--surface-alt)", borderRadius: 12, padding: "10px 12px" }}>
                    <p style={{ margin: 0, fontFamily: "var(--font-body)", fontSize: 11, color: "var(--text-dim)" }}>Periodo osservato</p>
                    <p style={{ margin: "2px 0 0", fontFamily: "var(--font-head)", fontSize: 18, color: "var(--text)" }}>{reportStats.giorniTotali} giorni</p>
                  </div>
                  {reportStats.variazioneBMI != null && (
                    <div style={{ background: "var(--surface-alt)", borderRadius: 12, padding: "10px 12px" }}>
                      <p style={{ margin: 0, fontFamily: "var(--font-body)", fontSize: 11, color: "var(--text-dim)" }}>Variazione BMI</p>
                      <p style={{ margin: "2px 0 0", fontFamily: "var(--font-head)", fontSize: 18, color: "var(--text)" }}>{reportStats.variazioneBMI > 0 ? "+" : ""}{reportStats.variazioneBMI}</p>
                    </div>
                  )}
                </div>

                {reportStats.progresso && (
                  <div style={{ background: "var(--surface-alt)", borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
                    <p style={{ margin: 0, fontFamily: "var(--font-head)", fontSize: 14, color: "var(--text)" }}>
                      Verso l'obiettivo: {reportStats.progresso.percentuale}%
                    </p>
                    <div style={{ background: "var(--surface)", borderRadius: 6, height: 8, marginTop: 8, overflow: "hidden" }}>
                      <div style={{ width: `${reportStats.progresso.percentuale}%`, height: "100%", background: "var(--accent)" }} />
                    </div>
                    <p style={{ margin: "8px 0 0", fontFamily: "var(--font-body)", fontSize: 11, color: "var(--text-dim)" }}>
                      Mancano {reportStats.progresso.distanzaAttuale} kg all'obiettivo di {obiettivo.pesoTarget} kg.
                      {reportStats.progresso.giorniAllaScadenza >= 0 ? ` Scadenza fissata tra ${reportStats.progresso.giorniAllaScadenza} giorni.` : " La data obiettivo è già passata."}
                      {reportStats.progresso.stimaData ? ` Al ritmo attuale, la stimo per il ${reportStats.progresso.stimaData.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" })}.` : ""}
                    </p>
                  </div>
                )}

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                  {grafici.filter((g) => g.data.length >= 2).map((g) => (
                    <MiniChart key={g.key} title={g.title} unit={g.unit} data={g.data} />
                  ))}
                </div>

                <p style={{ margin: "0 0 8px", fontFamily: "var(--font-head)", fontSize: 14, color: "var(--text)" }}>Foto progressi</p>
                {logsConFoto.length === 0 ? (
                  <p style={{ color: "var(--text-dim)", fontFamily: "var(--font-body)", fontSize: 12, marginBottom: 16 }}>
                    Nessuna foto ancora aggiunta alle misurazioni.
                  </p>
                ) : (
                  <div style={{ marginBottom: 16 }}>
                    <div style={{ position: "relative" }}>
                      <img src={fotoCorrente.photo} alt="" style={{ width: "100%", maxHeight: 320, objectFit: "cover", borderRadius: 14, display: "block" }} />
                      <button
                        onClick={() => setFotoIndex(Math.max(0, fotoIdx - 1))}
                        disabled={fotoIdx === 0}
                        style={{ ...navBtnStyle, position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", opacity: fotoIdx === 0 ? 0.3 : 1 }}
                      >‹</button>
                      <button
                        onClick={() => setFotoIndex(Math.min(logsConFoto.length - 1, fotoIdx + 1))}
                        disabled={fotoIdx === logsConFoto.length - 1}
                        style={{ ...navBtnStyle, position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", opacity: fotoIdx === logsConFoto.length - 1 ? 0.3 : 1 }}
                      >›</button>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 8 }}>
                      <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)" }}>
                        {new Date(fotoCorrente.date).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" })} · {fotoCorrente.peso} kg{fotoCorrente.bmi != null ? ` · BMI ${fotoCorrente.bmi}` : ""}
                      </span>
                      <span style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--text-dim)" }}>{fotoIdx + 1}/{logsConFoto.length}</span>
                    </div>
                  </div>
                )}

                <p style={{ margin: "0 0 8px", fontFamily: "var(--font-head)", fontSize: 14, color: "var(--text)" }}>Storico completo</p>
                <div style={{ background: "var(--surface-alt)", borderRadius: 12, overflow: "hidden", marginBottom: 10 }}>
                  {logs.map((l, i) => (
                    <div key={l.id} style={{
                      display: "flex", justifyContent: "space-between", padding: "8px 12px",
                      borderBottom: i < logs.length - 1 ? "1px solid var(--surface)" : "none",
                    }}>
                      <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)" }}>
                        {new Date(l.date).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" })}
                      </span>
                      <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text)" }}>
                        {l.peso} kg{l.bmi != null ? ` · BMI ${l.bmi}` : ""}
                      </span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {showForm && (
        <div style={overlayStyle} onClick={() => setShowForm(false)}>
          <div style={sheetStyle} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <h3 style={{ fontFamily: "var(--font-head)", margin: 0, color: "var(--text)" }}>Nuova misurazione</h3>
              <button onClick={() => setShowForm(false)} style={iconBtnStyle}><X size={18} /></button>
            </div>
            <label style={labelStyle}>Peso (kg)</label>
            <input type="number" step="0.1" value={peso} onChange={(e) => setPeso(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 10 }} placeholder="es. 98.5" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              {CAMPI_MISURE.map((c) => (
                <div key={c.key}>
                  <label style={labelStyle}>{c.label} ({c.unit}) — opz.</label>
                  <input
                    type="number" step="0.5"
                    value={misure[c.key] || ""}
                    onChange={(e) => setMisure({ ...misure, [c.key]: e.target.value })}
                    style={{ ...inputStyle, width: "100%" }}
                  />
                </div>
              ))}
            </div>
            <label style={labelStyle}>Note — opzionale</label>
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 10 }} placeholder="come ti senti oggi" />
            <button onClick={() => fileRef.current.click()} style={{ ...primaryBtnStyle, background: "var(--surface-alt)", color: "var(--text)", marginBottom: 10 }}>
              <Camera size={15} style={{ marginRight: 6, verticalAlign: -3 }} /> {photo ? "Foto selezionata ✓" : "Aggiungi foto"}
            </button>
            <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{ display: "none" }} />
            <button onClick={addLog} style={primaryBtnStyle}>Salva misurazione</button>
          </div>
        </div>
      )}
    </div>
  );
}

const TIPI_ATTIVITA = ["Camminata", "Corsa", "Bici", "Palestra", "Nuoto", "Altro"];

function AttivitaFisica({ logs, saveLogs }) {
  const [showForm, setShowForm] = useState(false);
  const [tipo, setTipo] = useState(TIPI_ATTIVITA[0]);
  const [durata, setDurata] = useState("");
  const [note, setNote] = useState("");

  const addLog = () => {
    if (!durata) return;
    const entry = { id: Date.now(), date: todayKey(), tipo, durata: parseInt(durata, 10), note };
    saveLogs([entry, ...logs]);
    setDurata(""); setNote(""); setShowForm(false);
  };

  const removeLog = (id) => saveLogs(logs.filter((l) => l.id !== id));
  const weekTotal = logs.filter((l) => {
    const d = new Date(l.date), now = new Date();
    return (now - d) / 86400000 <= 7;
  }).reduce((s, l) => s + l.durata, 0);

  return (
    <div style={{ padding: "20px 18px 90px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <h1 style={{ fontFamily: "var(--font-head)", fontSize: 28, margin: 0, color: "var(--text)" }}>Attività fisica</h1>
        <button onClick={() => setShowForm(true)} style={fabStyle}><Plus size={20} color="var(--bg)" /></button>
      </div>
      <p style={{ color: "var(--text-dim)", fontFamily: "var(--font-body)", fontSize: 13, marginTop: 0, marginBottom: 18 }}>
        {weekTotal} minuti negli ultimi 7 giorni
      </p>

      {logs.length === 0 && (
        <p style={{ color: "var(--text-dim)", fontFamily: "var(--font-body)", fontSize: 13, textAlign: "center", marginTop: 40 }}>
          Nessuna attività registrata. Aggiungine una con il pulsante +
        </p>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {logs.map((l) => (
          <div key={l.id} style={{ background: "var(--surface)", borderRadius: 14, padding: 14, display: "flex", gap: 12, alignItems: "center" }}>
            <div style={{ width: 40, height: 40, borderRadius: 10, background: "var(--surface-alt)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Dumbbell size={17} color="var(--accent)" />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                <span style={{ fontFamily: "var(--font-head)", fontSize: 15, color: "var(--text)" }}>{l.tipo}</span>
                <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)" }}>{l.durata} min</span>
              </div>
              <span style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--text-dim)" }}>
                {new Date(l.date).toLocaleDateString("it-IT", { day: "numeric", month: "long" })}
              </span>
              {l.note && <p style={{ margin: "4px 0 0", fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)" }}>{l.note}</p>}
            </div>
            <button onClick={() => removeLog(l.id)} style={iconBtnStyle}><Trash2 size={15} /></button>
          </div>
        ))}
      </div>

      {showForm && (
        <div style={overlayStyle} onClick={() => setShowForm(false)}>
          <div style={sheetStyle} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <h3 style={{ fontFamily: "var(--font-head)", margin: 0, color: "var(--text)" }}>Nuova attività</h3>
              <button onClick={() => setShowForm(false)} style={iconBtnStyle}><X size={18} /></button>
            </div>
            <label style={labelStyle}>Tipo</label>
            <select value={tipo} onChange={(e) => setTipo(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 10 }}>
              {TIPI_ATTIVITA.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
            <label style={labelStyle}>Durata (minuti)</label>
            <input type="number" value={durata} onChange={(e) => setDurata(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 10 }} placeholder="es. 30" />
            <label style={labelStyle}>Note — opzionale</label>
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 10 }} placeholder="intensità, percorso..." />
            <button onClick={addLog} style={primaryBtnStyle}>Salva attività</button>
          </div>
        </div>
      )}
    </div>
  );
}

    { titolo: "Dispensa e varie", articoli: ["Miele", "Curry in polvere", "Anacardi", "Semi di chia", "Mandorle a scaglie", "Cacao amaro", "Mix per pancake pronto", "Patate", "Proteine in polvere (opzionale)"] },
  ],
];

function ListaSpesa() {
  const now = new Date();
  const weekIdx = getISOWeek(now) % LISTA_SPESA.length;
  const lettera = ["A", "B", "C", "D", "E", "F", "G", "H"][weekIdx];
  const storageKey = `spesa-check-${now.getFullYear()}-w${getISOWeek(now)}`;
  const [checked, saveChecked] = useStoredState(storageKey, {});
  const categorie = LISTA_SPESA[weekIdx];

  const toggle = (id) => saveChecked({ ...checked, [id]: !checked[id] });

  const totale = categorie.reduce((s, c) => s + c.articoli.length, 0);
  const fatti = Object.values(checked).filter(Boolean).length;

  return (
    <div style={{ padding: "20px 18px 90px" }}>
      <h1 style={{ fontFamily: "var(--font-head)", fontSize: 28, margin: 0, color: "var(--text)" }}>Lista della spesa</h1>
      <p style={{ color: "var(--text-dim)", fontFamily: "var(--font-body)", fontSize: 13, marginTop: 4, marginBottom: 4 }}>
        Settimana {lettera} · {fatti}/{totale} presi
      </p>
      <p style={{ color: "var(--text-dim)", fontFamily: "var(--font-body)", fontSize: 12, marginTop: 0, marginBottom: 18, fontStyle: "italic" }}>
        Frutta di stagione questo mese: {fruttaDelMese(now)}
      </p>

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {categorie.map((cat, ci) => (
          <div key={ci}>
            <h3 style={{ fontFamily: "var(--font-head)", fontSize: 15, color: "var(--text)", margin: "0 0 8px" }}>{cat.titolo}</h3>
            <div style={{ background: "var(--surface)", borderRadius: 14, overflow: "hidden" }}>
              {cat.articoli.map((art, ai) => {
                const id = `${ci}-${ai}`;
                const done = !!checked[id];
                return (
                  <button
                    key={id}
                    onClick={() => toggle(id)}
                    style={{
                      width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                      padding: "10px 14px", background: "none", border: "none", cursor: "pointer",
                      borderBottom: ai < cat.articoli.length - 1 ? "1px solid var(--surface-alt)" : "none",
                    }}
                  >
                    <div style={{
                      width: 18, height: 18, borderRadius: 5, flexShrink: 0,
                      border: `1.5px solid ${done ? "var(--accent)" : "var(--text-dim)"}`,
                      background: done ? "var(--accent)" : "transparent",
                      display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      {done && <Check size={12} color="var(--bg)" strokeWidth={3} />}
                    </div>
                    <span style={{
                      fontFamily: "var(--font-body)", fontSize: 13,
                      color: done ? "var(--text-dim)" : "var(--text)",
                      textDecoration: done ? "line-through" : "none",
                    }}>
                      {art}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const navBtnStyle = { width: 30, height: 30, borderRadius: 8, border: "none", background: "var(--surface)", color: "var(--text)", cursor: "pointer", fontSize: 16 };
const overlayStyle = { position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "flex-end", zIndex: 50 };
const sheetStyle = { background: "var(--bg)", borderRadius: "18px 18px 0 0", padding: "20px 18px 26px", width: "100%", maxHeight: "85vh", overflowY: "auto" };
const inputStyle = { background: "var(--surface-alt)", border: "1px solid transparent", borderRadius: 10, padding: "9px 12px", color: "var(--text)", fontFamily: "var(--font-body)", fontSize: 14, outline: "none" };
const labelStyle = { display: "block", fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text-dim)", marginBottom: 5 };
const primaryBtnStyle = { width: "100%", background: "var(--accent)", border: "none", borderRadius: 12, padding: "12px", color: "var(--bg)", fontFamily: "var(--font-head)", fontSize: 14, cursor: "pointer" };
const iconBtnStyle = { background: "none", border: "none", color: "var(--text-dim)", cursor: "pointer", padding: 6 };
const fabStyle = { width: 38, height: 38, borderRadius: "50%", background: "var(--accent)", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" };

function App() {
  const [tab, setTab] = useState("diario");
  const [diary, saveDiary, diaryLoaded] = useStoredState("diary-log", {});
  const [mealTimes, saveMealTimes] = useStoredState("meal-times", DEFAULT_TIMES);
  const [physLogs, savePhysLogs] = useStoredState("physical-logs", []);
  const [actLogs, saveActLogs] = useStoredState("activity-logs", []);
  const [obiettivo, saveObiettivo] = useStoredState("obiettivo-dieta", { tipo: "perdita", pesoTarget: PESO_OBIETTIVO_DEFAULT, dataTarget: DATA_OBIETTIVO_DEFAULT });
  const [reminder, setReminder] = useState(null);
  const notifiedRef = useRef({});

  useEffect(() => {
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }, []);

  useEffect(() => {
    const check = () => {
      const now = new Date();
      const meals = getMealsForDate(now);
      const fabbisogno = calcolaFabbisogno(physLogs, actLogs, obiettivo, now);
      const fattoreScala = fabbisogno.target / CALORIE_BASE_PIANO;
      mealTimes.forEach((t, idx) => {
        const [h, m] = t.split(":").map(Number);
        const mealDate = new Date(now); mealDate.setHours(h, m, 0, 0);
        const diffMin = (mealDate - now) / 60000;
        const flagKey = `${todayKey()}-${idx}`;
        if (diffMin <= 10 && diffMin > 9 && !notifiedRef.current[flagKey]) {
          notifiedRef.current[flagKey] = true;
          setReminder({ label: meals[idx].l, time: t });
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`Tra 10 minuti: ${meals[idx].l}`, { body: scalaQuantita(meals[idx].d, fattoreScala) });
          }
        }
      });
    };
    const id = setInterval(check, 20000);
    check();
    return () => clearInterval(id);
  }, [mealTimes, physLogs, actLogs, obiettivo]);

  if (!diaryLoaded) return null;

  return (
    <div style={{
      "--bg": "#1B2420", "--surface": "#243129", "--surface-alt": "#2E3D34",
      "--text": "#EDECE6", "--text-dim": "#8FA098", "--accent": "#D9C46A",
      "--accent2": "#E2704F", "--font-head": "'Fraunces', serif", "--font-body": "'IBM Plex Sans', sans-serif",
      background: "var(--bg)", minHeight: "100vh", maxWidth: 420, margin: "0 auto", position: "relative",
      fontFamily: "var(--font-body)",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');
        input, select { font-family: var(--font-body); }
        input:focus, select:focus { outline: 1.5px solid var(--accent); }
      `}</style>

      {reminder && (
        <div style={{
          position: "fixed", top: 14, left: 14, right: 14, maxWidth: 392, margin: "0 auto",
          background: "var(--accent2)", borderRadius: 12, padding: "12px 14px", zIndex: 60,
          display: "flex", alignItems: "center", gap: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.3)",
        }}>
          <Bell size={16} color="#1B2420" />
          <span style={{ color: "#1B2420", fontFamily: "var(--font-body)", fontSize: 13, flex: 1 }}>
            Tra 10 minuti: <strong>{reminder.label}</strong> ({reminder.time})
          </span>
          <button onClick={() => setReminder(null)} style={{ background: "none", border: "none", cursor: "pointer" }}>
            <X size={15} color="#1B2420" />
          </button>
        </div>
      )}

      {tab === "diario" && <DiarioPasti diary={diary} saveDiary={saveDiary} mealTimes={mealTimes} saveMealTimes={saveMealTimes} physLogs={physLogs} actLogs={actLogs} obiettivo={obiettivo} />}
      {tab === "fisico" && <ParametriFisici logs={physLogs} saveLogs={savePhysLogs} obiettivo={obiettivo} saveObiettivo={saveObiettivo} actLogs={actLogs} />}
      {tab === "attivita" && <AttivitaFisica logs={actLogs} saveLogs={saveActLogs} />}
      {tab === "spesa" && <ListaSpesa />}

      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 420, margin: "0 auto",
        background: "var(--surface)", display: "flex", borderTop: "1px solid var(--surface-alt)",
      }}>
        <Tab active={tab === "diario"} onClick={() => setTab("diario")} icon={Utensils} label="Diario" />
        <Tab active={tab === "fisico"} onClick={() => setTab("fisico")} icon={Ruler} label="Fisico" />
        <Tab active={tab === "attivita"} onClick={() => setTab("attivita")} icon={Dumbbell} label="Attività" />
        <Tab active={tab === "spesa"} onClick={() => setTab("spesa")} icon={ShoppingCart} label="Spesa" />
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div id="boot-status">Si e\' verificato un errore nell\'avvio dell\'app.<br><br>Dettaglio tecnico:<br>' +
    (err && err.message ? err.message : String(err)) +
    '</div>';
  console.error(err);
}

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
